<div class="tv-container">
  <div class="bg-logo"></div>

  <div class="click-blocker" *ngIf="permisoAudio"></div>
  <div *ngIf="!permisoAudio" class="iniciar-pantalla" (click)="concederPermiso()">
    <h1>👆 Haz clic aquí para iniciar la TV</h1>
    <p>Requerido por el navegador para permitir el audio</p>
  </div>

  <div *ngIf="permisoAudio && !estadoBox?.cancionActual" class="waiting-screen">
    <div class="logo-container"></div>
    <div class="waiting-text">
      <h2>Esperando siguiente canción...</h2>
    </div>
  </div>

  <div class="video-wrapper" [style.display]="(permisoAudio && estadoBox?.cancionActual) ? 'block' : 'none'">
    <youtube-player
      [videoId]="estadoBox?.cancionActual?.videoId"
      [playerVars]="playerConfig"
      (ready)="onPlayerReady($event)"
      (stateChange)="onPlayerStateChange($event)">
    </youtube-player>
  </div>
</div>
